<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">
<title>Club Inventory — Login</title>
<link rel="stylesheet" href="styles.css">
<script src="app.js" defer></script>
<style id="clubGateCSS">
html:not(.clubReady) body>:not(#clubGate) {
  display:none!important
}
#clubGate {
  position:fixed;
  inset:0;
  z-index:9999;
  background:#121622;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font:16px Arial
}
#clubGate>section {
  max-width:440px;
  text-align:center;
  background:#222a3d;
  border:1px solid #485273;
  border-radius:15px;
  padding:26px
}
#clubGate p {
  color:#d2d9ec;
  line-height:1.5
}
#gateRetry {
  border:0;
  border-radius:9px;
  padding:12px 18px;
  cursor:pointer
}
#gateRetry[hidden],
html.clubReady #clubGate {
  display:none!important
}
</style></head>
<body>
<header>
<div class="brand">📦 Club Inventory</div>
<button class="secondary"
onclick="toggleTheme()">🌗 Theme</button>
</header>

<main>
<section class="panel login">
<h1>Welcome back</h1>
<p class="muted">Enter your email address.</p>

<form onsubmit="clubLogin(event)">
<label for="email">Email address</label>
<input id="email"
type="email"
autocomplete="email"
placeholder="you@example.com"
required>

<p id="loginMessage" role="alert"></p>
<button type="submit">Continue</button>
</form>
</section>
</main>
</body>
</html>

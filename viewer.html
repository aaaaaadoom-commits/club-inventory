<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Club Inventory — Viewer</title><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script><style id="clubGateCSS">
html:not(.clubReady) body>:not(#clubGate) {
  display:none!important
}
#clubGate {
  position:fixed;
  inset:0;
  z-index:9999;
  background:#121622;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font:16px Arial
}
#clubGate>section {
  max-width:440px;
  text-align:center;
  background:#222a3d;
  border:1px solid #485273;
  border-radius:15px;
  padding:26px
}
#clubGate p {
  color:#d2d9ec;
  line-height:1.5
}
#gateRetry {
  border:0;
  border-radius:9px;
  padding:12px 18px;
  cursor:pointer
}
#gateRetry[hidden],
html.clubReady #clubGate {
  display:none!important
}
</style></head><body><header><div class="brand">📦 Club Inventory <span class="small">Viewer</span></div><div class="header-actions"><button class="secondary" onclick="toggleTheme()">🌗 Theme</button><button class="secondary" onclick="logout()">Log out</button></div></header><main><div class="toolbar"><div><h1>Inventory</h1><p class="muted">Read-only inventory.</p></div></div><div class="filters"><input id="search" placeholder="Search inventory" oninput="renderInventory('viewer')"><select id="categoryFilter" onchange="renderInventory('viewer')"><option value="">All categories</option></select></div><div style="height:20px"></div><section class="grid" id="productGrid"></section></main><script>document.addEventListener('DOMContentLoaded',()=>renderInventory('viewer'));</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Product — Club Inventory</title><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script></head><body><header><div class="brand">📦 Club Inventory</div><button class="secondary" onclick="toggleTheme()">🌗 Theme</button></header><main><section class="panel form-panel"><h1>Add product</h1><p class="muted">Only name, quantity and image are required.</p><form onsubmit="submitProduct(event,false)"><label for="name">Product name *</label><input id="name" required maxlength="150"><label for="quantity">Quantity *</label><input id="quantity" type="number" min="0" step="1" value="1" required><label for="image">Product image *</label><input id="image" type="file" accept="image/png,image/jpeg,image/webp" required><label for="category">Category (optional)</label><input id="category"><label for="owner">Owner (optional)</label><input id="owner"><label for="notes">Notes (optional)</label><textarea id="notes"></textarea><p id="status" class="status" role="alert"></p><div class="button-row"><button type="submit">Save product</button><a href="editor.html" class="button secondary">Cancel</a></div></form></section></main></body></html>
